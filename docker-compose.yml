services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ad-password-manager-db
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd123!
      MYSQL_DATABASE: ad_password_manager
      MYSQL_USER: pmp
      MYSQL_PASSWORD: P@ssw0rd123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - ad-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pP@ssw0rd123!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ad-password-manager-api
    environment:
      PORT: 3001
      NODE_ENV: production

      # Database (MySQL)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ad_password_manager
      DB_USER: pmp
      DB_PASSWORD: P@ssw0rd123!

      # Local superadmin (Admin Login on the UI — not the MySQL DB user)
      SUPERADMIN_USERNAME: pmp
      SUPERADMIN_PASSWORD: P@ssw0rd123!
      SUPERADMIN_EMAIL: pmp@localhost
      SUPERADMIN_FULL_NAME: PMP Administrator

      # Active Directory (must match your working LDAP app settings)
      AD_URL: ldap://10.12.0.11:389
      AD_BASE_DN: dc=globiva,dc=com
      AD_BIND_DN: CN=Lokesh Singh,OU=Manager,OU=Information Technology,OU=Support,OU=Users,OU=GGN418-Signature,DC=globiva,DC=com
      AD_BIND_PASSWORD: Lucky@78612
      AD_USER_SEARCH_FILTER: (sAMAccountName={username})
      AD_DEFAULT_DOMAIN: globiva.com

      # LDAP for lookup/unlock (plain 389 is ok if your network trusts it — no STARTTLS if it fails.)
      AD_START_TLS: "false"

      # unicodePwd (password reset) — use LDAPS on 636 (avoids STARTTLS disconnect on many networks/firewalls).
      AD_LDAPS_URL: "ldaps://10.12.0.11:636"
      AD_TLS_REJECT_UNAUTHORIZED: "false"
      LICENSE_DEFAULT_MAX_USERS: "10"
      LICENSE_DEFAULT_ORGANIZATION: Globiva
      LICENSE_SIGNING_SECRET: MyProductionSecret2026GlobivaGPMPLokeshSingh

      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRY: 24h

      # Email SMTP
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
      SMTP_FROM: noreply@company.com

      # SMS Twilio
      TWILIO_ACCOUNT_SID: your_twilio_account_sid
      TWILIO_AUTH_TOKEN: your_twilio_auth_token
      TWILIO_PHONE_NUMBER: +1234567890

      # OTP
      OTP_VALIDITY: 300
      OTP_EXPIRY: 5

      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ad-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: ad-password-manager-ui
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ad-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  ad-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
